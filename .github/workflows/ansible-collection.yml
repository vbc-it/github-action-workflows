---
name: ansible-collection-tests  # zizmor: ignore[excessive-permissions] jobs declare their own
on:
  workflow_call:
    inputs:
      platform:
        description: 'The platform to run molecule tests on'
        required: true
        default: 'ubuntu-latest'
        type: string
      collection-path:
        description: 'Path to the Ansible collection root'
        required: false
        default: '.'
        type: string
      force_all_roles:
        description: 'Set to true to run all roles regardless of the changeset'
        required: false
        default: false
        type: boolean
      molecule_env_file:
        description: 'Optional file to source before running molecule tests'
        required: false
        default: ''
        type: string
      publish_to_automationhub:
        description: 'Build and publish the collection to a private Automation Hub when running on a tag'
        required: false
        default: false
        type: boolean
      automationhub_url:
        description: 'Private Automation Hub API endpoint used by ansible-galaxy collection publish'
        required: false
        default: 'https://tower.vbc.ac.at/api/galaxy/'
        type: string
      sanity_ansible_versions:
        description: 'JSON list of ansible-core branches to run the sanity tests against'
        required: false
        default: '["stable-2.16", "stable-2.17", "stable-2.18"]'
        type: string
      molecule_all_roles_paths:
        description: >-
          Newline-separated shell patterns, relative to collection-path, of shared files
          whose changes run the scenarios of all roles (`*` also matches `/`).
          molecule_env_file and shared files in extensions/molecule/ are always included
        required: false
        default: |
          plugins/*
          requirements.yml
          tests/requirements.yml
          pyproject.toml
          uv.lock
        type: string
      molecule_timeout_minutes:
        description: 'Timeout for each Molecule scenario job'
        required: false
        default: 120
        type: number
    secrets:
      automationhub_token:
        description: 'Token for publishing to private Automation Hub'
        required: false

jobs:

  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate tag and publish configuration
        if: ${{ inputs.publish_to_automationhub && github.ref_type == 'tag' }}
        env:
          AUTOMATIONHUB_URL: ${{ inputs.automationhub_url }}
          # Only whether the secret is set reaches the script, never its value.
          HAS_AUTOMATIONHUB_TOKEN: ${{ secrets.automationhub_token != '' }}
          COLLECTION_PATH: ${{ inputs.collection-path }}
        run: |
          if [[ -z "$AUTOMATIONHUB_URL" ]]; then
            echo "publish_to_automationhub=true requires automationhub_url." >&2
            exit 1
          fi

          if [[ "$HAS_AUTOMATIONHUB_TOKEN" != "true" ]]; then
            echo "publish_to_automationhub=true requires secrets.automationhub_token." >&2
            exit 1
          fi

          galaxy_file="$COLLECTION_PATH/galaxy.yml"
          if [[ ! -f "$galaxy_file" ]]; then
            echo "Could not find galaxy.yml at $galaxy_file" >&2
            exit 1
          fi

          # Top-level key only: an indented "version:" elsewhere in the file must not match.
          galaxy_version=$(sed -nE "s/^version:[[:space:]]*['\"]?([^'\"[:space:]]+)['\"]?[[:space:]]*$/\1/p" "$galaxy_file" | head -n1)
          if [[ -z "$galaxy_version" ]]; then
            echo "Unable to read version from $galaxy_file" >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$galaxy_version" ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match galaxy.yml version '${galaxy_version}'" >&2
            exit 1
          fi

          echo "Tag '${GITHUB_REF_NAME}' matches galaxy.yml version '${galaxy_version}'"

  pre-commit:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: tox-dev/action-pre-commit-uv@9316eafda3550b0365575c60b9f53725a81d0cfd # v1.1.2
        env:
          SKIP: ansible-lint


  ansible-lint:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check if requirements.yml exists
        id: check-requirements
        env:
          COLLECTION_PATH: ${{ inputs.collection-path }}
        run: |
          if [[ -f "$COLLECTION_PATH/requirements.yml" ]]; then
            echo "has-requirements=true" >> $GITHUB_OUTPUT
          else
            echo "has-requirements=false" >> $GITHUB_OUTPUT
          fi

      - name: Run ansible-lint (with requirements)
        if: steps.check-requirements.outputs.has-requirements == 'true'
        uses: ansible/ansible-lint@b74fb6f73d234bf92672372cb1c10768e4018d16 # v26.11.0
        with:
          working_directory: ${{ inputs.collection-path }}
          requirements_file: "requirements.yml"

      - name: Run ansible-lint (without requirements)
        if: steps.check-requirements.outputs.has-requirements == 'false'
        uses: ansible/ansible-lint@b74fb6f73d234bf92672372cb1c10768e4018d16 # v26.11.0
        with:
          working_directory: ${{ inputs.collection-path }}

  sanity:
    needs: validate-release
    name: Sanity (Ⓐ${{ matrix.ansible }})
    strategy:
      matrix:
        # It's important that Sanity is tested against all stable-X.Y branches
        # Testing against `devel` may fail as new tests are added.
        # An alternative to `devel` is the `milestone` branch with
        # gets synchronized with `devel` every few weeks and therefore
        # tends to be a more stable target. Be aware that it is not updated
        # around creation of a new stable branch, this might cause a problem
        # that two different versions of ansible-test use the same sanity test
        # ignore.txt file.
        # Add new versions announced in
        # https://github.com/ansible-collections/news-for-maintainers in a timely manner,
        # consider dropping testing against EOL versions and versions you don't support.
        # Callers set the list with sanity_ansible_versions to match requires_ansible.
        ansible: ${{ fromJSON(inputs.sanity_ansible_versions) }}

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    # Replaces ansible-community/ansible-test-gh-action, whose nested actions
    # are not SHA-pinned. ansible-test runs the tests in its default test
    # container, which has the pinned test dependencies and all Python
    # versions the ansible-core release supports.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: src
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # A fixed uv release is checked against the checksum built into setup-uv.
          version: '0.13.6'
          enable-cache: false

      - name: Install ansible-core
        env:
          ANSIBLE_BRANCH: ${{ matrix.ansible }}
        run: |
          set -euo pipefail
          if [[ ! "$ANSIBLE_BRANCH" =~ ^stable-2\.[0-9]+$ ]]; then
            echo "::error::sanity_ansible_versions entries must look like stable-2.X"
            printf 'Got: %q\n' "$ANSIBLE_BRANCH"
            exit 1
          fi
          venv="$RUNNER_TEMP/ansible-sanity-venv"
          # Python 3.12 runs ansible-test of ansible-core 2.16 to 2.20; the
          # tests themselves run on the Python versions of the test container.
          uv venv --no-config --python 3.12 "$venv"
          # Newest PyPI release of the branch, wheels only, so no build
          # scripts run.
          uv pip install --no-config --python "$venv/bin/python" --only-binary ':all:' \
            "ansible-core==${ANSIBLE_BRANCH#stable-}.*"
          uv pip list --no-config --python "$venv/bin/python"

      - name: Place collection at ansible_collections/<namespace>/<name>
        id: place
        env:
          COLLECTION_PATH: ${{ inputs.collection-path }}
        run: |
          set -euo pipefail
          if [[ "$COLLECTION_PATH" == /* || "/$COLLECTION_PATH/" == */../* ]]; then
            echo "::error::collection-path must be a relative path inside the repository"
            exit 1
          fi
          src=src
          if [[ -n "$COLLECTION_PATH" && "$COLLECTION_PATH" != "." ]]; then
            src="src/${COLLECTION_PATH%/}"
          fi
          meta=$("$RUNNER_TEMP/ansible-sanity-venv/bin/python" -I -c '
          import sys, yaml
          with open(sys.argv[1], encoding="utf-8") as f:
              meta = yaml.safe_load(f)
          print(meta["namespace"])
          print(meta["name"])
          ' "$src/galaxy.yml")
          namespace=${meta%%$'\n'*}
          name=${meta#*$'\n'}
          for value in "$namespace" "$name"; do
            if [[ ! "$value" =~ ^[a-z0-9_]+$ ]]; then
              echo "::error::galaxy.yml namespace and name must match ^[a-z0-9_]+$"
              printf 'Got: %q\n' "$value"
              exit 1
            fi
          done
          dest="ansible_collections/$namespace/$name"
          mkdir -p "ansible_collections/$namespace"
          mv "$src" "$dest"
          echo "collection-dir=$dest" >> "$GITHUB_OUTPUT"

      - name: Run ansible-test sanity
        env:
          COLLECTION_DIR: ${{ steps.place.outputs.collection-dir }}
        run: |
          set -euo pipefail
          cd "$COLLECTION_DIR"
          # The arguments ansible-test-gh-action used for sanity, without
          # change detection and without coverage (sanity produces none).
          "$RUNNER_TEMP/ansible-sanity-venv/bin/ansible-test" sanity -v --color --junit --docker default

      - name: Show test container image
        if: always()
        run: docker image ls --digests --filter 'reference=quay.io/ansible/*'


  # Every other job declares the permissions it needs. discover keeps the
  # caller's token as granted: dorny/paths-filter needs pull-requests: read on
  # pull_request events in private repositories, and requesting a scope the
  # caller did not grant would stop the whole workflow from starting.
  discover:  # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-latest
    # Only needs validate-release, so Molecule (the slowest job) runs in parallel
    # with pre-commit, ansible-lint and sanity. check still waits for all of them.
    needs: validate-release
    timeout-minutes: 15
    outputs:
      role_scenarios: ${{ steps.discover-scenarios.outputs.role_scenarios }}
    steps:
      # Credentials stay in .git/config here: dorny/paths-filter runs git fetch
      # on push events, which needs them for private and internal repositories.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true  # zizmor: ignore[artipacked]

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Newest version whose checksum is built into this setup-uv release.
          version: "0.13.6"

      - name: Sync dependencies with uv
        run: uv sync --locked --dev
        working-directory: ${{ inputs.collection-path }}

      # Tag runs test all roles: a release must not be published on an empty changeset.
      - name: Set test scope
        id: scope
        env:
          FORCE_ALL_ROLES: ${{ inputs.force_all_roles }}
        run: |
          if [[ "$FORCE_ALL_ROLES" == "true" ]]; then
            echo "all_roles=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "all_roles=true" >> "$GITHUB_OUTPUT"
          else
            echo "all_roles=false" >> "$GITHUB_OUTPUT"
          fi

      # Add a step to list all roles when running full tests
      - name: List all roles
        id: list-roles
        if: steps.scope.outputs.all_roles == 'true'
        env:
          COLLECTION_PATH: ${{ inputs.collection-path }}
        run: |
          echo "role_folders=$(find "$COLLECTION_PATH"/roles/* -maxdepth 0 -type d -exec basename {} \; | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Find changeset
        if: steps.scope.outputs.all_roles == 'false'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.ref }}
          list-files: json
          filters: |
            changed:
              - '**'

      # Map changed files to roles: roles/<role>/ and extensions/molecule/<role>/ select that role.
      # Other files in extensions/molecule/, molecule_env_file and molecule_all_roles_paths select all roles.
      - name: Select roles from changeset
        id: changed-roles
        if: steps.scope.outputs.all_roles == 'false'
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.changed_files }}
          ALL_ROLES_PATHS: ${{ inputs.molecule_all_roles_paths }}
          MOLECULE_ENV_FILE: ${{ inputs.molecule_env_file }}
          COLLECTION_PATH: ${{ inputs.collection-path }}
        run: |
          mapfile -t patterns <<< "$ALL_ROLES_PATHS"
          if [[ -n "$MOLECULE_ENV_FILE" ]]; then
            patterns+=("${MOLECULE_ENV_FILE#./}")
          fi
          prefix="${COLLECTION_PATH#./}"
          prefix="${prefix%/}"

          all_roles=false
          folders=()
          while IFS= read -r f; do
            if [[ -n "$prefix" && "$prefix" != "." ]]; then
              [[ "$f" == "$prefix/"* ]] || continue
              f="${f#"$prefix/"}"
            fi
            if [[ "$f" =~ ^roles/([^/]+)/ ]]; then
              folders+=("${BASH_REMATCH[1]}")
            elif [[ "$f" =~ ^extensions/molecule/([^/]+)/ && -d "$COLLECTION_PATH/roles/${BASH_REMATCH[1]}" ]]; then
              folders+=("${BASH_REMATCH[1]}")
            elif [[ "$f" == extensions/molecule/* ]]; then
              echo "Shared Molecule file changed: $f"
              all_roles=true
            else
              for p in "${patterns[@]}"; do
                # Unquoted $p so it matches as a shell pattern.
                # shellcheck disable=SC2053
                if [[ -n "$p" && "$f" == $p ]]; then
                  echo "Shared file changed: $f (matches $p)"
                  all_roles=true
                  break
                fi
              done
            fi
          done < <(jq -r '.[]' <<< "${CHANGED_FILES:-[]}")

          if [[ "$all_roles" == "true" ]]; then
            echo "Testing all roles"
            mapfile -t folders < <(find "$COLLECTION_PATH/roles" -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)
          fi
          echo "role_folders=${folders[*]}" >> "$GITHUB_OUTPUT"

      - name: Discover scenarios for each role
        id: discover-scenarios
        env:
          ALL_ROLES: ${{ steps.scope.outputs.all_roles }}
          LISTED_ROLES: ${{ steps.list-roles.outputs.role_folders }}
          CHANGED_ROLES: ${{ steps.changed-roles.outputs.role_folders }}
          COLLECTION_PATH: ${{ inputs.collection-path }}
        run: |
          # Role and scenario names come from directory names in the caller's
          # changeset and end up in the job matrix, so only plain names pass.
          role_re='^[A-Za-z0-9_]+$'
          scenario_re='^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)?$'

          folders=()
          if [[ "$ALL_ROLES" == "true" ]]; then
            read -r -a folders <<< "$LISTED_ROLES"
          else
            read -r -a folders <<< "$CHANGED_ROLES"
          fi

          mapfile -t candidate_folders < <(printf "%s\n" "${folders[@]}" | sed '/^$/d' | sort -u)
          # Collection role names are [a-z0-9_]; anything else under roles/ is
          # not a role and is skipped, so its name never reaches a shell or the matrix.
          unique_folders=()
          for role in "${candidate_folders[@]}"; do
            if [[ "$role" =~ $role_re ]]; then
              unique_folders+=("$role")
            else
              printf '::warning::Skipping roles/ entry with an invalid role name: %q\n' "$role"
            fi
          done
          echo "Found ${#unique_folders[@]} changed/selected role(s)"

          role_scenarios_json='[]'
          json_items=""

          # Legacy collection: discover scenarios by running Molecule inside each selected role.
          for role in "${unique_folders[@]}"; do
            role_path="$COLLECTION_PATH/roles/$role"
            if [[ ! -d "$role_path/molecule" ]]; then
              continue
            fi

            set +e
            legacy_output=$(cd "$role_path" && uv run molecule list -f yaml 2>&1)
            legacy_rc=$?
            set -e

            if [[ "$legacy_rc" -ne 0 ]]; then
              if echo "$legacy_output" | grep -q "glob failed"; then
                continue
              else
                echo "$legacy_output" >&2
                exit "$legacy_rc"
              fi
            fi

            mapfile -t legacy_scenarios < <(
              echo "$legacy_output" \
                | sed -nE "s/^[[:space:]]*Scenario Name:[[:space:]]*'?(.*)'?$/\1/p" \
                | sed '/^$/d' \
                | sort -u
            )

            for scenario_name in "${legacy_scenarios[@]}"; do
              if [[ "$scenario_name" == "$role/"* ]]; then
                scenario_name="${scenario_name#*/}"
              fi

              scenario_name="$(printf '%s' "$scenario_name" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
              if [[ -z "$scenario_name" ]]; then
                continue
              fi
              if [[ ! "$scenario_name" =~ $scenario_re ]]; then
                printf 'Invalid scenario name: %q in role %s (allowed: %s)\n' "$scenario_name" "$role" "$scenario_re" >&2
                exit 1
              fi

              json_items+="$(jq -c -n \
                --arg role "$role" \
                --arg scenario "$scenario_name" \
                --argjson is_native false \
                '{role: $role, scenario: $scenario, is_native: $is_native}'
              )"$'\n'
            done
          done

          # Native collection: discover scenarios from collection root.
          if [[ -d "$COLLECTION_PATH/extensions/molecule" ]]; then
            set +e
            native_output=$(cd "$COLLECTION_PATH" && uv run molecule list -f yaml 2>&1)
            native_rc=$?
            set -e

            if [[ "$native_rc" -ne 0 ]]; then
              if ! echo "$native_output" | grep -q "glob failed"; then
                echo "$native_output" >&2
                exit "$native_rc"
              fi
            else
              mapfile -t native_scenarios < <(
                echo "$native_output" \
                  | sed -nE "s/^[[:space:]]*Scenario Name:[[:space:]]*'?(.*)'?$/\1/p" \
                  | sed '/^$/d' \
                  | sort -u
              )

              for full_scenario in "${native_scenarios[@]}"; do
                full_scenario="$(printf '%s' "$full_scenario" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
                if [[ -z "$full_scenario" || "$full_scenario" == "default" ]]; then
                  continue
                fi

                if [[ "$full_scenario" == */* ]]; then
                  role="${full_scenario%%/*}"
                else
                  role="$full_scenario"
                fi

                # Keep native scenario names exactly as reported by molecule list.
                scenario="$full_scenario"

                role="$(printf '%s' "$role" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
                scenario="$(printf '%s' "$scenario" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
                if [[ -z "$role" || -z "$scenario" ]]; then
                  continue
                fi
                # Keep only role scenarios that are part of the selected/changed roles.
                if ! printf "%s\n" "${unique_folders[@]}" | grep -Fxq "$role"; then
                  continue
                fi
                if [[ ! "$scenario" =~ $scenario_re ]]; then
                  printf 'Invalid scenario name: %q (allowed: %s)\n' "$scenario" "$scenario_re" >&2
                  exit 1
                fi

                json_items+="$(jq -c -n \
                  --arg role "$role" \
                  --arg scenario "$scenario" \
                  --argjson is_native true \
                  '{role: $role, scenario: $scenario, is_native: $is_native}'
                )"$'\n'
              done
            fi
          fi

          if [[ -n "$json_items" ]]; then
            role_scenarios_json=$(printf "%s" "$json_items" | jq -c -s 'unique_by([.role, .scenario, .is_native])')
          fi

          # Output the result
          printf 'role_scenarios=%s\n' "$role_scenarios_json" >> "$GITHUB_OUTPUT"

          # Display summary
          count=$(echo "$role_scenarios_json" | jq '. | length')
          if [ "$count" -eq 0 ]; then
            echo "No role-scenario combinations found"
          else
            echo "Found $count role-scenario combination(s):"
            echo "$role_scenarios_json" | jq -r '.[] | "  - " + (if .is_native then .scenario else (.role + "/" + .scenario) end) + " [native=\(.is_native)]"'
          fi

  molecule:
    needs: discover
    runs-on: ${{ inputs.platform }}
    timeout-minutes: ${{ inputs.molecule_timeout_minutes }}
    if: ${{ needs.discover.outputs.role_scenarios != '' && toJson(fromJson(needs.discover.outputs.role_scenarios)) != '[]' }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.role_scenarios) }}
      fail-fast: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Sync dependencies with uv
        run: uv sync --locked --dev
        working-directory: ${{ inputs.collection-path }}

      - name: Run molecule tests for role ${{ matrix.role }} scenario ${{ matrix.scenario }}
        run: |
          source "$GITHUB_WORKSPACE/$COLLECTION_PATH/.venv/bin/activate"
          if [[ -n "$MOLECULE_ENV_FILE" ]]; then
            set -a && source "$MOLECULE_ENV_FILE" && set +a
          fi
          molecule --version
          # required because with shared_state dependency is not executed before create scenario, but create needs dependencies to be installed
          molecule dependency --scenario-name "$SCENARIO"
          molecule test --scenario-name "$SCENARIO"

        working-directory: ${{ matrix.is_native && inputs.collection-path || format('{0}/roles/{1}', inputs.collection-path, matrix.role) }}
        env:
          COLLECTION_PATH: ${{ inputs.collection-path }}
          MOLECULE_ENV_FILE: ${{ inputs.molecule_env_file }}
          SCENARIO: ${{ matrix.scenario }}
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_ROLES_PATH: "${GITHUB_WORKSPACE}/${{ inputs.collection-path }}/roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles"

  check:  # This job does nothing and is only used for the branch protection
          # or multi-stage CI jobs, like making sure that all tests pass before
          # a publishing job is started.
    if: always()

    needs:
      - validate-release
      - pre-commit
      - ansible-lint
      - sanity
      - discover
      - molecule

    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: molecule

  publish-automationhub:
    needs: check
    runs-on: self-hosted
    timeout-minutes: 20
    if: ${{ always() && needs.check.result == 'success' && inputs.publish_to_automationhub && github.ref_type == 'tag' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Sync dependencies with uv
        run: uv sync --locked --dev
        working-directory: ${{ inputs.collection-path }}

      - name: Build collection artifact
        run: uv run --locked ansible-galaxy collection build --output-path dist
        working-directory: ${{ inputs.collection-path }}

      # The token reaches ansible-galaxy through its server configuration in the
      # environment, so it is neither in the generated script nor on the command line.
      - name: Publish collection artifact to private Automation Hub
        env:
          ANSIBLE_GALAXY_SERVER_LIST: automationhub
          ANSIBLE_GALAXY_SERVER_AUTOMATIONHUB_URL: ${{ inputs.automationhub_url }}
          ANSIBLE_GALAXY_SERVER_AUTOMATIONHUB_TOKEN: ${{ secrets.automationhub_token }}
        run: |
          artifact=$(ls -1 dist/*.tar.gz | head -n1)
          if [[ -z "$artifact" ]]; then
            echo "No built collection artifact found in dist/." >&2
            exit 1
          fi
          uv run --locked ansible-galaxy collection publish "$artifact" --server automationhub
        working-directory: ${{ inputs.collection-path }}
