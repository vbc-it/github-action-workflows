---
name: ansible-collection-tests  # zizmor: ignore[excessive-permissions] jobs declare their own
on:
  workflow_call:
    inputs:
      platform:
        description: 'The platform to run molecule tests on'
        required: true
        default: 'ubuntu-latest'
        type: string
      collection-path:
        description: 'Path to the Ansible collection root'
        required: false
        default: '.'
        type: string
      force_all_roles:
        description: 'Set to true to run all roles regardless of the changeset'
        required: false
        default: false
        type: boolean
      molecule_env_file:
        description: 'Optional file to source before running molecule tests'
        required: false
        default: ''
        type: string
      publish_to_automationhub:
        description: 'Build and publish the collection to a private Automation Hub when running on a tag'
        required: false
        default: false
        type: boolean
      automationhub_url:
        description: 'Private Automation Hub API endpoint used by ansible-galaxy collection publish'
        required: false
        default: 'https://tower.vbc.ac.at/api/galaxy/'
        type: string
      sanity_ansible_versions:
        description: 'JSON list of ansible-core branches to run the sanity tests against'
        required: false
        default: '["stable-2.16", "stable-2.17", "stable-2.18"]'
        type: string
      molecule_all_roles_paths:
        description: >-
          Newline-separated shell patterns, relative to collection-path, of shared files
          whose changes run the scenarios of all roles (`*` also matches `/`).
          molecule_env_file and shared files in extensions/molecule/ are always included
        required: false
        default: |
          plugins/*
          requirements.yml
          tests/requirements.yml
          pyproject.toml
          uv.lock
        type: string
      molecule_timeout_minutes:
        description: 'Timeout for each Molecule scenario job'
        required: false
        default: 120
        type: number
      molecule_scenarios:
        description: >-
          JSON object mapping role names to the scenarios to run, e.g.
          {"ssh": ["default", "hostbased"], "certificate": []}. A listed role runs
          only the listed scenarios, [] excludes the role, unlisted roles run all
          their scenarios. Empty means all discovered scenarios
        required: false
        default: ''
        type: string
      molecule_max_parallel:
        description: 'Maximum number of Molecule scenario jobs running at the same time; 0 means no limit'
        required: false
        default: 0
        type: number
      molecule_lock_scenarios:
        description: >-
          JSON list of scenarios ("<role>/<scenario>" for legacy layouts, the Molecule
          scenario name for native layouts) that must not run at the same time as the
          same scenario in another run of this repository
        required: false
        default: '[]'
        type: string
      molecule_base_config:
        description: 'Repository-relative path of a Molecule base config, passed as molecule --base-config'
        required: false
        default: ''
        type: string
      ansible_config:
        description: 'Repository-relative path of an ansible.cfg, exported as ANSIBLE_CONFIG for Molecule'
        required: false
        default: ''
        type: string
      test_all_roles_on_tag:
        description: >-
          Test all roles on tag runs, like force_all_roles. With false, tag runs
          test only the roles changed by the tagged commit
        required: false
        default: true
        type: boolean
      publish_runner:
        description: >-
          Runner label for the publish job. Automation Hub is only reachable from
          internal runners; use a label that only dedicated release runners carry
        required: false
        default: 'self-hosted'
        type: string
      publish_environment:
        description: >-
          GitHub environment of the publish job in the calling repository. Protect it
          with required reviewers and a deployment tag rule; the token can be stored there
        required: false
        default: 'automationhub'
        type: string
    secrets:
      automationhub_token:
        description: 'Token for publishing to private Automation Hub'
        required: false
      op_service_account_token:
        description: '1Password service account token, exported as OP_SERVICE_ACCOUNT_TOKEN for Molecule; also installs the op CLI'
        required: false
      galaxy_server_token:
        description: 'Token exported as ANSIBLE_GALAXY_SERVER_{PUBLISHED,RH_CERTIFIED,COMMUNITY,STAGING}_TOKEN for Molecule'
        required: false

jobs:

  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag and publish configuration
        if: ${{ inputs.publish_to_automationhub && github.ref_type == 'tag' }}
        env:
          AUTOMATIONHUB_URL: ${{ inputs.automationhub_url }}
          COLLECTION_PATH: ${{ inputs.collection-path }}
        run: |
          if [[ -z "$AUTOMATIONHUB_URL" ]]; then
            echo "publish_to_automationhub=true requires automationhub_url." >&2
            exit 1
          fi

          galaxy_file="$COLLECTION_PATH/galaxy.yml"
          if [[ ! -f "$galaxy_file" ]]; then
            echo "Could not find galaxy.yml at $galaxy_file" >&2
            exit 1
          fi

          # Top-level key only: an indented "version:" elsewhere in the file must not match.
          galaxy_version=$(sed -nE "s/^version:[[:space:]]*['\"]?([^'\"[:space:]]+)['\"]?[[:space:]]*$/\1/p" "$galaxy_file" | head -n1)
          if [[ -z "$galaxy_version" ]]; then
            echo "Unable to read version from $galaxy_file" >&2
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$galaxy_version" ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match galaxy.yml version '${galaxy_version}'" >&2
            exit 1
          fi

          echo "Tag '${GITHUB_REF_NAME}' matches galaxy.yml version '${galaxy_version}'"

  pre-commit:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tox-dev/action-pre-commit-uv@9316eafda3550b0365575c60b9f53725a81d0cfd # v1.1.2
        env:
          SKIP: ansible-lint


  ansible-lint:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check if requirements.yml exists
        id: check-requirements
        env:
          COLLECTION_PATH: ${{ inputs.collection-path }}
        run: |
          if [[ -f "$COLLECTION_PATH/requirements.yml" ]]; then
            echo "has-requirements=true" >> $GITHUB_OUTPUT
          else
            echo "has-requirements=false" >> $GITHUB_OUTPUT
          fi

      - name: Run ansible-lint (with requirements)
        if: steps.check-requirements.outputs.has-requirements == 'true'
        uses: ansible/ansible-lint@b74fb6f73d234bf92672372cb1c10768e4018d16 # v26.11.0
        with:
          working_directory: ${{ inputs.collection-path }}
          requirements_file: "requirements.yml"

      - name: Run ansible-lint (without requirements)
        if: steps.check-requirements.outputs.has-requirements == 'false'
        uses: ansible/ansible-lint@b74fb6f73d234bf92672372cb1c10768e4018d16 # v26.11.0
        with:
          working_directory: ${{ inputs.collection-path }}

  sanity:
    needs: validate-release
    name: Sanity (Ⓐ${{ matrix.ansible }})
    strategy:
      matrix:
        # It's important that Sanity is tested against all stable-X.Y branches
        # Testing against `devel` may fail as new tests are added.
        # An alternative to `devel` is the `milestone` branch with
        # gets synchronized with `devel` every few weeks and therefore
        # tends to be a more stable target. Be aware that it is not updated
        # around creation of a new stable branch, this might cause a problem
        # that two different versions of ansible-test use the same sanity test
        # ignore.txt file.
        # Add new versions announced in
        # https://github.com/ansible-collections/news-for-maintainers in a timely manner,
        # consider dropping testing against EOL versions and versions you don't support.
        # Callers set the list with sanity_ansible_versions to match requires_ansible.
        ansible: ${{ fromJSON(inputs.sanity_ansible_versions) }}

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    # Replaces ansible-community/ansible-test-gh-action, whose nested actions
    # are not SHA-pinned. ansible-test runs the tests in its default test
    # container, which has the pinned test dependencies and all Python
    # versions the ansible-core release supports.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # A fixed uv release is checked against the checksum built into setup-uv.
          version: "0.13.9"
          enable-cache: false

      - name: Install ansible-core
        env:
          ANSIBLE_BRANCH: ${{ matrix.ansible }}
        run: |
          set -euo pipefail
          if [[ ! "$ANSIBLE_BRANCH" =~ ^stable-2\.[0-9]+$ ]]; then
            echo "::error::sanity_ansible_versions entries must look like stable-2.X"
            printf 'Got: %q\n' "$ANSIBLE_BRANCH"
            exit 1
          fi
          venv="$RUNNER_TEMP/ansible-sanity-venv"
          # Python 3.12 runs ansible-test of ansible-core 2.16 to 2.20; the
          # tests themselves run on the Python versions of the test container.
          uv venv --no-config --python 3.12 "$venv"
          # Newest PyPI release of the branch, wheels only, so no build
          # scripts run.
          uv pip install --no-config --python "$venv/bin/python" --only-binary ':all:' \
            "ansible-core==${ANSIBLE_BRANCH#stable-}.*"
          uv pip list --no-config --python "$venv/bin/python"

      - name: Place collection at ansible_collections/<namespace>/<name>
        id: place
        env:
          COLLECTION_PATH: ${{ inputs.collection-path }}
        run: |
          set -euo pipefail
          if [[ "$COLLECTION_PATH" == /* || "/$COLLECTION_PATH/" == */../* ]]; then
            echo "::error::collection-path must be a relative path inside the repository"
            exit 1
          fi
          src=src
          if [[ -n "$COLLECTION_PATH" && "$COLLECTION_PATH" != "." ]]; then
            src="src/${COLLECTION_PATH%/}"
          fi
          meta=$("$RUNNER_TEMP/ansible-sanity-venv/bin/python" -I -c '
          import sys, yaml
          with open(sys.argv[1], encoding="utf-8") as f:
              meta = yaml.safe_load(f)
          print(meta["namespace"])
          print(meta["name"])
          ' "$src/galaxy.yml")
          namespace=${meta%%$'\n'*}
          name=${meta#*$'\n'}
          for value in "$namespace" "$name"; do
            if [[ ! "$value" =~ ^[a-z0-9_]+$ ]]; then
              echo "::error::galaxy.yml namespace and name must match ^[a-z0-9_]+$"
              printf 'Got: %q\n' "$value"
              exit 1
            fi
          done
          dest="ansible_collections/$namespace/$name"
          mkdir -p "ansible_collections/$namespace"
          mv "$src" "$dest"
          echo "collection-dir=$dest" >> "$GITHUB_OUTPUT"

      - name: Run ansible-test sanity
        env:
          COLLECTION_DIR: ${{ steps.place.outputs.collection-dir }}
        run: |
          set -euo pipefail
          cd "$COLLECTION_DIR"
          # The arguments ansible-test-gh-action used for sanity, without
          # change detection and without coverage (sanity produces none).
          "$RUNNER_TEMP/ansible-sanity-venv/bin/ansible-test" sanity -v --color --junit --docker default

      - name: Show test container image
        if: always()
        run: docker image ls --digests --filter 'reference=quay.io/ansible/*'


  # Every other job declares the permissions it needs. discover keeps the
  # caller's token as granted: dorny/paths-filter needs pull-requests: read on
  # pull_request events in private repositories, and requesting a scope the
  # caller did not grant would stop the whole workflow from starting.
  discover:  # zizmor: ignore[excessive-permissions]
    runs-on: ubuntu-latest
    # Only needs validate-release, so Molecule (the slowest job) runs in parallel
    # with pre-commit, ansible-lint and sanity. check still waits for all of them.
    needs: validate-release
    timeout-minutes: 15
    outputs:
      role_scenarios: ${{ steps.discover-scenarios.outputs.role_scenarios }}
    steps:
      # Credentials stay in .git/config here: dorny/paths-filter runs git fetch
      # on push events, which needs them for private and internal repositories.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true  # zizmor: ignore[artipacked]

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Newest version whose checksum is built into this setup-uv release.
          version: "0.13.9"

      - name: Sync dependencies with uv
        run: uv sync --locked --dev
        working-directory: ${{ inputs.collection-path }}

      # Tag runs test all roles (test_all_roles_on_tag): a release must not be
      # published on an empty changeset.
      - name: Set test scope
        id: scope
        env:
          FORCE_ALL_ROLES: ${{ inputs.force_all_roles }}
          TEST_ALL_ROLES_ON_TAG: ${{ inputs.test_all_roles_on_tag }}
        run: |
          if [[ "$FORCE_ALL_ROLES" == "true" ]]; then
            echo "all_roles=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            echo "all_roles=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_TYPE" == "tag" && "$TEST_ALL_ROLES_ON_TAG" == "true" ]]; then
            echo "all_roles=true" >> "$GITHUB_OUTPUT"
          else
            echo "all_roles=false" >> "$GITHUB_OUTPUT"
          fi

      # Add a step to list all roles when running full tests
      - name: List all roles
        id: list-roles
        if: steps.scope.outputs.all_roles == 'true'
        env:
          COLLECTION_PATH: ${{ inputs.collection-path }}
        run: |
          echo "role_folders=$(find "$COLLECTION_PATH"/roles/* -maxdepth 0 -type d -exec basename {} \; | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Find changeset
        if: steps.scope.outputs.all_roles == 'false'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.ref }}
          list-files: json
          filters: |
            changed:
              - '**'

      # Map changed files to roles: roles/<role>/ and extensions/molecule/<role>/ select that role.
      # Other files in extensions/molecule/, molecule_env_file and molecule_all_roles_paths select all roles.
      - name: Select roles from changeset
        id: changed-roles
        if: steps.scope.outputs.all_roles == 'false'
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.changed_files }}
          ALL_ROLES_PATHS: ${{ inputs.molecule_all_roles_paths }}
          MOLECULE_ENV_FILE: ${{ inputs.molecule_env_file }}
          COLLECTION_PATH: ${{ inputs.collection-path }}
        run: |
          mapfile -t patterns <<< "$ALL_ROLES_PATHS"
          if [[ -n "$MOLECULE_ENV_FILE" ]]; then
            patterns+=("${MOLECULE_ENV_FILE#./}")
          fi
          prefix="${COLLECTION_PATH#./}"
          prefix="${prefix%/}"

          all_roles=false
          folders=()
          while IFS= read -r f; do
            if [[ -n "$prefix" && "$prefix" != "." ]]; then
              [[ "$f" == "$prefix/"* ]] || continue
              f="${f#"$prefix/"}"
            fi
            if [[ "$f" =~ ^roles/([^/]+)/ ]]; then
              folders+=("${BASH_REMATCH[1]}")
            elif [[ "$f" =~ ^extensions/molecule/([^/]+)/ && -d "$COLLECTION_PATH/roles/${BASH_REMATCH[1]}" ]]; then
              folders+=("${BASH_REMATCH[1]}")
            elif [[ "$f" == extensions/molecule/* ]]; then
              echo "Shared Molecule file changed: $f"
              all_roles=true
            else
              for p in "${patterns[@]}"; do
                # Unquoted $p so it matches as a shell pattern.
                # shellcheck disable=SC2053
                if [[ -n "$p" && "$f" == $p ]]; then
                  echo "Shared file changed: $f (matches $p)"
                  all_roles=true
                  break
                fi
              done
            fi
          done < <(jq -r '.[]' <<< "${CHANGED_FILES:-[]}")

          if [[ "$all_roles" == "true" ]]; then
            echo "Testing all roles"
            mapfile -t folders < <(find "$COLLECTION_PATH/roles" -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)
          fi
          echo "role_folders=${folders[*]}" >> "$GITHUB_OUTPUT"

      - name: Discover scenarios for each role
        id: discover-scenarios
        env:
          ALL_ROLES: ${{ steps.scope.outputs.all_roles }}
          LISTED_ROLES: ${{ steps.list-roles.outputs.role_folders }}
          CHANGED_ROLES: ${{ steps.changed-roles.outputs.role_folders }}
          COLLECTION_PATH: ${{ inputs.collection-path }}
          MOLECULE_SCENARIOS: ${{ inputs.molecule_scenarios }}
          MOLECULE_LOCK_SCENARIOS: ${{ inputs.molecule_lock_scenarios }}
        run: |
          # Role and scenario names come from directory names in the caller's
          # changeset and end up in the job matrix, so only plain names pass.
          role_re='^[A-Za-z0-9_]+$'
          scenario_re='^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)?$'

          # The "Scenario Name:" parser below needs plain text: coloured output
          # (PY_COLORS, FORCE_COLOR, a colour TERM) would silently yield no scenarios.
          unset FORCE_COLOR CLICOLOR_FORCE ANSIBLE_FORCE_COLOR
          export NO_COLOR=1 PY_COLORS=0 ANSIBLE_NOCOLOR=1
          # Strip ANSI CSI and OSC sequences and carriage returns in case a tool ignores the above.
          strip_ansi() {
            local esc=$'\033' bel=$'\007' cr=$'\r'
            sed -E "s#${esc}\[[0-9;:?]*[ -/]*[@-~]##g; s#${esc}\][^${esc}${bel}]*(${bel}|${esc}\\\\)##g; s#${cr}##g"
          }

          # molecule_scenarios: {"<role>": ["<scenario>", ...]}. Checked even
          # when no role is selected, so a typo fails every run.
          selection=''
          if [[ -n "${MOLECULE_SCENARIOS//[[:space:]]/}" ]]; then
            valid='if type == "object" and all(.[]; type == "array" and all(.[]; type == "string")) then . else error("invalid") end'
            if ! selection=$(jq -ce "$valid" <<< "$MOLECULE_SCENARIOS" 2>/dev/null); then
              echo '::error::molecule_scenarios must be a JSON object mapping role names to lists of scenario names,' \
                'e.g. {"ssh": ["default"], "certificate": []}'
              exit 1
            fi
            while IFS= read -r listed_role; do
              if [[ ! "$listed_role" =~ $role_re || ! -d "$COLLECTION_PATH/roles/$listed_role" ]]; then
                printf '::error::molecule_scenarios lists %q, which is not a role under roles/\n' "$listed_role"
                exit 1
              fi
            done < <(jq -r 'keys[]' <<< "$selection")
          fi

          # molecule_lock_scenarios is read by the molecule job's concurrency
          # expression; check it here for a clear error.
          if ! jq -e 'type == "array" and all(.[]; type == "string")' <<< "${MOLECULE_LOCK_SCENARIOS:-[]}" > /dev/null 2>&1; then
            echo '::error::molecule_lock_scenarios must be a JSON list of scenario names, e.g. ["certificate/create"]'
            exit 1
          fi

          folders=()
          if [[ "$ALL_ROLES" == "true" ]]; then
            read -r -a folders <<< "$LISTED_ROLES"
          else
            read -r -a folders <<< "$CHANGED_ROLES"
          fi

          mapfile -t candidate_folders < <(printf "%s\n" "${folders[@]}" | sed '/^$/d' | sort -u)
          # Collection role names are [a-z0-9_]; anything else under roles/ is
          # not a role and is skipped, so its name never reaches a shell or the matrix.
          unique_folders=()
          for role in "${candidate_folders[@]}"; do
            if [[ "$role" =~ $role_re ]]; then
              unique_folders+=("$role")
            else
              printf '::warning::Skipping roles/ entry with an invalid role name: %q\n' "$role"
            fi
          done
          echo "Found ${#unique_folders[@]} changed/selected role(s)"

          role_scenarios_json='[]'
          json_items=""

          # Legacy collection: discover scenarios by running Molecule inside each selected role.
          for role in "${unique_folders[@]}"; do
            role_path="$COLLECTION_PATH/roles/$role"
            if [[ ! -d "$role_path/molecule" ]]; then
              continue
            fi

            set +e
            legacy_output=$(cd "$role_path" && uv run molecule list -f yaml 2>&1)
            legacy_rc=$?
            set -e
            legacy_output=$(strip_ansi <<< "$legacy_output")

            if [[ "$legacy_rc" -ne 0 ]]; then
              if echo "$legacy_output" | grep -q "glob failed"; then
                continue
              else
                echo "$legacy_output" >&2
                exit "$legacy_rc"
              fi
            fi

            mapfile -t legacy_scenarios < <(
              echo "$legacy_output" \
                | sed -nE "s/^[[:space:]]*Scenario Name:[[:space:]]*'?(.*)'?$/\1/p" \
                | sed '/^$/d' \
                | sort -u
            )
            if [[ ${#legacy_scenarios[@]} -eq 0 ]]; then
              echo "$legacy_output" >&2
              echo "::error::roles/$role/molecule exists and molecule list succeeded, but no scenario could be parsed from its output"
              exit 1
            fi

            for scenario_name in "${legacy_scenarios[@]}"; do
              if [[ "$scenario_name" == "$role/"* ]]; then
                scenario_name="${scenario_name#*/}"
              fi

              scenario_name="$(printf '%s' "$scenario_name" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
              if [[ -z "$scenario_name" ]]; then
                continue
              fi
              if [[ ! "$scenario_name" =~ $scenario_re ]]; then
                printf 'Invalid scenario name: %q in role %s (allowed: %s)\n' "$scenario_name" "$role" "$scenario_re" >&2
                exit 1
              fi

              json_items+="$(jq -c -n \
                --arg role "$role" \
                --arg scenario "$scenario_name" \
                --argjson is_native false \
                '{role: $role, scenario: $scenario, is_native: $is_native}'
              )"$'\n'
            done
          done

          # Native collection: discover scenarios from collection root.
          if [[ -d "$COLLECTION_PATH/extensions/molecule" ]]; then
            set +e
            native_output=$(cd "$COLLECTION_PATH" && uv run molecule list -f yaml 2>&1)
            native_rc=$?
            set -e
            native_output=$(strip_ansi <<< "$native_output")

            if [[ "$native_rc" -ne 0 ]]; then
              if ! echo "$native_output" | grep -q "glob failed"; then
                echo "$native_output" >&2
                exit "$native_rc"
              fi
            else
              mapfile -t native_scenarios < <(
                echo "$native_output" \
                  | sed -nE "s/^[[:space:]]*Scenario Name:[[:space:]]*'?(.*)'?$/\1/p" \
                  | sed '/^$/d' \
                  | sort -u
              )
              if [[ ${#native_scenarios[@]} -eq 0 ]]; then
                echo "$native_output" >&2
                echo "::error::extensions/molecule exists and molecule list succeeded, but no scenario could be parsed from its output"
                exit 1
              fi

              for full_scenario in "${native_scenarios[@]}"; do
                full_scenario="$(printf '%s' "$full_scenario" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
                if [[ -z "$full_scenario" || "$full_scenario" == "default" ]]; then
                  continue
                fi

                if [[ "$full_scenario" == */* ]]; then
                  role="${full_scenario%%/*}"
                else
                  role="$full_scenario"
                fi

                # Keep native scenario names exactly as reported by molecule list.
                scenario="$full_scenario"

                role="$(printf '%s' "$role" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
                scenario="$(printf '%s' "$scenario" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
                if [[ -z "$role" || -z "$scenario" ]]; then
                  continue
                fi
                # Keep only role scenarios that are part of the selected/changed roles.
                if ! printf "%s\n" "${unique_folders[@]}" | grep -Fxq "$role"; then
                  continue
                fi
                if [[ ! "$scenario" =~ $scenario_re ]]; then
                  printf 'Invalid scenario name: %q (allowed: %s)\n' "$scenario" "$scenario_re" >&2
                  exit 1
                fi

                json_items+="$(jq -c -n \
                  --arg role "$role" \
                  --arg scenario "$scenario" \
                  --argjson is_native true \
                  '{role: $role, scenario: $scenario, is_native: $is_native}'
                )"$'\n'
              done
            fi
          fi

          if [[ -n "$json_items" ]]; then
            role_scenarios_json=$(printf "%s" "$json_items" | jq -c -s 'unique_by([.role, .scenario, .is_native])')
          fi

          # Apply molecule_scenarios. A listed scenario matches the discovered
          # name or, for native layouts, "<role>/<listed name>".
          if [[ -n "$selection" ]]; then
            selected_json=$(printf '%s\n' "${unique_folders[@]}" | jq -R . | jq -cs 'map(select(length > 0))')
            missing=$(jq -r --argjson sel "$selection" --argjson selected "$selected_json" '
              . as $found
              | $sel | to_entries[]
              | .key as $r
              | select($selected | index($r))
              | .value[] as $s
              | select([$found[] | select(.role == $r and (.scenario == $s or .scenario == ($r + "/" + $s)))] | length == 0)
              | "\($r): \($s)"' <<< "$role_scenarios_json")
            if [[ -n "$missing" ]]; then
              echo "::error::molecule_scenarios lists scenarios that discovery did not find:"
              printf '  %s\n' "$missing"
              exit 1
            fi
            # shellcheck disable=SC2016  # jq variables, not shell variables
            filter='def wanted($sel): . as $e | ($sel | has($e.role) | not)
              or any($sel[$e.role][]; $e.scenario == . or $e.scenario == ($e.role + "/" + .));'
            excluded=$(jq -r --argjson sel "$selection" "$filter"'
              .[] | select(wanted($sel) | not) | "  - " + (if .is_native then .scenario else .role + "/" + .scenario end)' <<< "$role_scenarios_json")
            if [[ -n "$excluded" ]]; then
              echo "Excluded by molecule_scenarios:"
              printf '%s\n' "$excluded"
            fi
            role_scenarios_json=$(jq -c --argjson sel "$selection" "$filter"' map(select(wanted($sel)))' <<< "$role_scenarios_json")
          fi

          # Output the result
          printf 'role_scenarios=%s\n' "$role_scenarios_json" >> "$GITHUB_OUTPUT"

          # Display summary
          count=$(echo "$role_scenarios_json" | jq '. | length')
          if [ "$count" -eq 0 ]; then
            echo "No role-scenario combinations found"
          else
            echo "Found $count role-scenario combination(s):"
            echo "$role_scenarios_json" | jq -r '.[] | "  - " + (if .is_native then .scenario else (.role + "/" + .scenario) end) + " [native=\(.is_native)]"'
          fi

  molecule:
    needs: discover
    runs-on: ${{ inputs.platform }}
    timeout-minutes: ${{ inputs.molecule_timeout_minutes }}
    if: ${{ needs.discover.outputs.role_scenarios != '' && toJson(fromJson(needs.discover.outputs.role_scenarios)) != '[]' }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.role_scenarios) }}
      fail-fast: false
      # 0 (the default) means no limit; a matrix has at most 256 jobs.
      max-parallel: ${{ inputs.molecule_max_parallel > 0 && inputs.molecule_max_parallel || 256 }}
    # Scenarios in molecule_lock_scenarios share one group per repository, role and
    # scenario, so runs of the same scenario wait for each other (GitHub keeps only
    # the newest pending job of a group and cancels older pending ones). Every
    # other job gets a group of its own and is never held back.
    concurrency:
      group: >-
        ${{ contains(fromJSON(inputs.molecule_lock_scenarios), matrix.is_native && matrix.scenario || format('{0}/{1}', matrix.role, matrix.scenario))
        && format('molecule-lock-{0}-{1}-{2}', github.repository, matrix.role, matrix.scenario)
        || format('molecule-{0}-{1}-{2}-{3}-{4}-{5}-{6}', github.run_id, github.run_attempt,
                  inputs.collection-path, inputs.platform, matrix.is_native, matrix.role, matrix.scenario) }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      - name: Sync dependencies with uv
        run: uv sync --locked --dev
        working-directory: ${{ inputs.collection-path }}

      - name: Check whether the op CLI is needed
        id: op
        env:
          OP_TOKEN_SECRET: ${{ secrets.op_service_account_token }}
        run: |
          if [[ -n "$OP_TOKEN_SECRET" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      # Downloads a fixed op release into the tool cache (no root needed) and
      # verifies its GPG signature against 1Password's key bundled in the
      # action. Needs gpg and unzip on the runner.
      - name: Install 1Password CLI
        if: steps.op.outputs.needed == 'true'
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: "2.35.0"

      - name: Run molecule tests for role ${{ matrix.role }} scenario ${{ matrix.scenario }}
        run: |
          # shellcheck disable=SC1090
          source "$GITHUB_WORKSPACE/$COLLECTION_PATH/.venv/bin/activate"
          # Unique per run attempt and scenario, so parallel jobs on one host
          # don't share container, network or external names. Set before
          # molecule_env_file, which may override it.
          INSTANCE_ID=$(printf '%s' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ROLE}-${SCENARIO}" | sha1sum | cut -c1-16)
          export INSTANCE_ID

          # Optional secrets, exported only when set. molecule_env_file can still override them.
          if [[ -n "$OP_TOKEN_SECRET" ]]; then
            export OP_SERVICE_ACCOUNT_TOKEN="$OP_TOKEN_SECRET"
            op --version
          fi
          if [[ -n "$GALAXY_TOKEN_SECRET" ]]; then
            for server in PUBLISHED RH_CERTIFIED COMMUNITY STAGING; do
              export "ANSIBLE_GALAXY_SERVER_${server}_TOKEN=$GALAXY_TOKEN_SECRET"
            done
          fi
          unset OP_TOKEN_SECRET GALAXY_TOKEN_SECRET

          # Repository-relative config files.
          repo_file() {
            if [[ "$2" == /* || "/$2/" == */../* ]]; then
              printf '::error::%s must be a path relative to the repository root, got %q\n' "$1" "$2"
              exit 1
            fi
            if [[ ! -f "$GITHUB_WORKSPACE/$2" ]]; then
              printf '::error::%s: %q does not exist\n' "$1" "$2"
              exit 1
            fi
          }
          base_config=()
          if [[ -n "$MOLECULE_BASE_CONFIG" ]]; then
            repo_file molecule_base_config "$MOLECULE_BASE_CONFIG"
            base_config=(--base-config "$GITHUB_WORKSPACE/$MOLECULE_BASE_CONFIG")
          fi
          if [[ -n "$ANSIBLE_CONFIG_FILE" ]]; then
            repo_file ansible_config "$ANSIBLE_CONFIG_FILE"
            export ANSIBLE_CONFIG="$GITHUB_WORKSPACE/$ANSIBLE_CONFIG_FILE"
          fi

          if [[ -n "$MOLECULE_ENV_FILE" ]]; then
            # shellcheck disable=SC1090
            set -a && source "$MOLECULE_ENV_FILE" && set +a
          fi
          echo "INSTANCE_ID=${INSTANCE_ID}"
          molecule --version
          # required because with shared_state dependency is not executed before create scenario, but create needs dependencies to be installed
          molecule "${base_config[@]}" dependency --scenario-name "$SCENARIO"
          molecule "${base_config[@]}" test --scenario-name "$SCENARIO"

        working-directory: ${{ matrix.is_native && inputs.collection-path || format('{0}/roles/{1}', inputs.collection-path, matrix.role) }}
        env:
          COLLECTION_PATH: ${{ inputs.collection-path }}
          MOLECULE_ENV_FILE: ${{ inputs.molecule_env_file }}
          MOLECULE_BASE_CONFIG: ${{ inputs.molecule_base_config }}
          ANSIBLE_CONFIG_FILE: ${{ inputs.ansible_config }}
          OP_TOKEN_SECRET: ${{ secrets.op_service_account_token }}
          GALAXY_TOKEN_SECRET: ${{ secrets.galaxy_server_token }}
          ROLE: ${{ matrix.role }}
          SCENARIO: ${{ matrix.scenario }}
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_ROLES_PATH: "${GITHUB_WORKSPACE}/${{ inputs.collection-path }}/roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles"

  check:  # This job does nothing and is only used for the branch protection
          # or multi-stage CI jobs, like making sure that all tests pass before
          # a publishing job is started.
    if: always()

    needs:
      - validate-release
      - pre-commit
      - ansible-lint
      - sanity
      - discover
      - molecule

    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: molecule

  # Builds the release tarball without any secrets, on a fresh GitHub-hosted
  # runner (no internal access needed, nothing left behind by earlier jobs), with
  # the same pinned ansible-galaxy as the publish job: no code from the
  # repository runs. The publish job only downloads this artifact.
  build-collection:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !cancelled() && needs.check.result == 'success' && inputs.publish_to_automationhub && github.ref_type == 'tag' }}
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Defense in depth: the protected publish environment is the real guard.
      - name: Check that the tag points to a commit on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$DEFAULT_BRANCH" ]]; then
            echo "Cannot determine the default branch for event '$GITHUB_EVENT_NAME'." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "Tag '$GITHUB_REF_NAME' points to $GITHUB_SHA, which is not on '$DEFAULT_BRANCH'; refusing to publish." >&2
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false

      - name: Build collection artifact
        working-directory: ${{ inputs.collection-path }}
        env:
          ANSIBLE_CORE_VERSION: "2.20.11"
          UV_EXCLUDE_NEWER: "2026-11-19T00:00:00Z"
        run: |
          rm -rf dist
          uv tool run --no-cache --no-config --python 3.12 --no-build \
            --from "ansible-core==${ANSIBLE_CORE_VERSION}" \
            ansible-galaxy collection build --output-path dist
          shopt -s nullglob
          artifacts=(dist/*.tar.gz)
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "Expected exactly one collection tarball in dist/, found ${#artifacts[@]}." >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${artifacts[0]}" != *"-${tag_version}.tar.gz" ]]; then
            echo "Built ${artifacts[0]} does not match tag version '${tag_version}'." >&2
            exit 1
          fi
          sha256sum "${artifacts[0]}"

      # Unique per call of this workflow; the publish job downloads it by ID.
      # Kept long enough for a delayed environment approval.
      - name: Upload collection artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collection-${{ hashFiles(format('{0}/galaxy.yml', inputs.collection-path)) }}
          path: ${{ inputs.collection-path }}/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-automationhub:
    needs: build-collection
    # Automation Hub is only reachable from internal runners. Use a label that
    # only dedicated (ideally ephemeral) release runners carry, separate from
    # the runners that execute tests.
    runs-on: ${{ inputs.publish_runner }}  # zizmor: ignore[self-hosted-runner]
    # Caller-side GitHub environment: add required reviewers and a tag rule there.
    environment: ${{ inputs.publish_environment }}
    timeout-minutes: 20
    if: ${{ !cancelled() && needs.build-collection.result == 'success' && inputs.publish_to_automationhub && github.ref_type == 'tag' }}
    # No checkout and no repository token: this job only downloads the artifact
    # from this run and uploads it.
    permissions: {}
    steps:
      - name: Download collection artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-collection.outputs.artifact-id }}
          path: ${{ runner.temp }}/collection

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false

      # Runs ansible-galaxy from a fixed ansible-core release (resolved as of a
      # fixed date, wheels only) in a clean environment: a temporary HOME, a
      # minimal PATH, an empty Ansible config, and a freshly downloaded Python,
      # so nothing that other jobs left in the home directory of a shared runner
      # is used. The token reaches ansible-galaxy through its server
      # configuration in the environment, never through the command line.
      - name: Publish collection artifact to private Automation Hub
        working-directory: ${{ runner.temp }}/collection
        env:
          AUTOMATIONHUB_URL: ${{ inputs.automationhub_url }}
          AUTOMATIONHUB_TOKEN: ${{ secrets.automationhub_token }}
        run: |
          if [[ -z "$AUTOMATIONHUB_TOKEN" ]]; then
            echo "publish_to_automationhub=true requires secrets.automationhub_token." >&2
            exit 1
          fi
          shopt -s nullglob
          artifacts=(*.tar.gz)
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "Expected exactly one downloaded collection tarball, found ${#artifacts[@]}." >&2
            exit 1
          fi
          sha256sum "${artifacts[0]}"

          clean="$RUNNER_TEMP/publish-env"
          rm -rf "$clean" && mkdir -p "$clean/home"
          : > "$clean/ansible.cfg"
          uv_bin=$(command -v uv)
          # Network settings of the runner (proxy, internal CA bundle) are kept.
          passthrough=()
          for var in HTTP_PROXY HTTPS_PROXY NO_PROXY http_proxy https_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR REQUESTS_CA_BUNDLE; do
            if [[ -n "${!var:-}" ]]; then
              passthrough+=("$var=${!var}")
            fi
          done
          env -i \
            "${passthrough[@]}" \
            HOME="$clean/home" \
            PATH="/usr/bin:/bin" \
            LANG=C.UTF-8 \
            UV_PYTHON_INSTALL_DIR="$clean/python" \
            UV_PYTHON_PREFERENCE=only-managed \
            UV_EXCLUDE_NEWER="2026-11-19T00:00:00Z" \
            ANSIBLE_CONFIG="$clean/ansible.cfg" \
            ANSIBLE_GALAXY_SERVER_LIST=automationhub \
            ANSIBLE_GALAXY_SERVER_AUTOMATIONHUB_URL="$AUTOMATIONHUB_URL" \
            ANSIBLE_GALAXY_SERVER_AUTOMATIONHUB_TOKEN="$AUTOMATIONHUB_TOKEN" \
            "$uv_bin" tool run --no-cache --no-config --python 3.12 --no-build \
              --from "ansible-core==2.20.11" \
              ansible-galaxy collection publish "${artifacts[0]}" --server automationhub
