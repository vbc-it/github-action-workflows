---
name: container-image  # zizmor: ignore[excessive-permissions] jobs declare their own
on:
  workflow_call:
    inputs:
      image:
        description: 'Repository of the image below the namespace, e.g. netbox or galaxy/app'
        required: true
        type: string
      namespace:
        description: 'Organization in the registry that the image is pushed to'
        required: false
        default: 'it'
        type: string
      registry:
        description: 'Registry that the image is pushed to'
        required: false
        default: 'quay.vbc.ac.at'
        type: string
      registry_username:
        description: 'Robot account with write access to the namespace; required when push is true'
        required: false
        default: ''
        type: string
      ref:
        description: 'Branch, tag or commit of the calling repository to build; defaults to the ref of the run'
        required: false
        default: ''
        type: string
      context:
        description: 'Build context, relative to the repository root'
        required: false
        default: '.'
        type: string
      dockerfile:
        description: 'Dockerfile, relative to the repository root'
        required: false
        default: 'Dockerfile'
        type: string
      build_args:
        description: 'Newline-separated KEY=VALUE build arguments'
        required: false
        default: ''
        type: string
      tags:
        description: 'Newline-separated tags to push; defaults to the branch or tag name of the run'
        required: false
        default: ''
        type: string
      push:
        description: 'Push the image after building it; false only builds'
        required: false
        default: false
        type: boolean
      platform:
        description: 'Runner to build on; it needs docker, skopeo, curl and jq'
        required: false
        default: 'self-hosted'
        type: string
      aap_job_template:
        description: 'ID of an AAP job template to launch after a push; empty launches nothing'
        required: false
        default: ''
        type: string
      aap_launch:
        description: 'JSON body of the AAP launch request, e.g. {"job_tags": "reload", "extra_vars": {"tag": "main"}}'
        required: false
        default: '{}'
        type: string
      aap_url:
        description: 'Base URL of the AAP controller'
        required: false
        default: 'https://tower.vbc.ac.at'
        type: string
      aap_timeout_minutes:
        description: 'Timeout for the AAP job'
        required: false
        default: 60
        type: number
    secrets:
      registry_password:
        description: 'Password of registry_username; required when push is true'
        required: false
      aap_username:
        description: 'AAP account with execute permission on aap_job_template'
        required: false
      aap_password:
        description: 'Password of aap_username'
        required: false
    outputs:
      digest:
        description: 'Manifest digest of the pushed image; empty when push is false'
        value: ${{ jobs.build.outputs.digest }}
      image_ref:
        description: 'Pushed image as <registry>/<namespace>/<image>@<digest>; empty when push is false'
        value: ${{ jobs.build.outputs.image_ref }}

jobs:

  build:
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image_ref: ${{ steps.push.outputs.image_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Callers build several images of one run in parallel on runners that can share a docker daemon.
      - name: Name the local image and the registry auth file after the run and the image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          build="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(printf '%s' "$IMAGE" | sha256sum | cut -c1-12)"
          {
            echo "LOCAL_IMAGE=localhost/container-image:${build}"
            echo "IMAGE_ID_FILE=${RUNNER_TEMP}/image-id-${build}"
            echo "REGISTRY_AUTH_FILE=${RUNNER_TEMP}/registry-auth-${build}.json"
          } >> "$GITHUB_ENV"

      - name: Build image
        env:
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_ARGS: ${{ inputs.build_args }}
          PUSH: ${{ inputs.push }}
        run: |
          arguments=()
          # Another job on a shared docker daemon could have poisoned the build cache.
          if [[ "$PUSH" == "true" ]]; then
            arguments+=(--no-cache)
          fi
          while IFS= read -r build_arg; do
            if [[ -n "$build_arg" ]]; then
              arguments+=(--build-arg "$build_arg")
            fi
          done <<< "$BUILD_ARGS"

          docker build --pull \
            --file "$DOCKERFILE" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            "${arguments[@]}" \
            --iidfile "$IMAGE_ID_FILE" \
            --tag "$LOCAL_IMAGE" \
            "$CONTEXT"

      - name: Push image
        id: push
        if: ${{ inputs.push }}
        env:
          REGISTRY: ${{ inputs.registry }}
          REPOSITORY: ${{ inputs.registry }}/${{ inputs.namespace }}/${{ inputs.image }}
          REGISTRY_USERNAME: ${{ inputs.registry_username }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}
          TAGS: ${{ inputs.tags || github.ref_name }}
        run: |
          if [[ -z "$REGISTRY_USERNAME" || -z "$REGISTRY_PASSWORD" ]]; then
            echo "push=true requires registry_username and secrets.registry_password." >&2
            exit 1
          fi

          # Push by the content-addressed image ID: another job on a shared docker daemon can retag LOCAL_IMAGE.
          image_id=$(cat "$IMAGE_ID_FILE")
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "docker build wrote no valid image ID to ${IMAGE_ID_FILE}." >&2
            exit 1
          fi

          skopeo login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin <<< "$REGISTRY_PASSWORD"

          # The first tag is pushed from the daemon; later tags copy that manifest by digest within the registry.
          digest=''
          digest_file="${IMAGE_ID_FILE}.digest"
          while IFS= read -r tag; do
            if [[ -z "$tag" ]]; then
              continue
            fi

            if [[ -z "$digest" ]]; then
              skopeo copy --digestfile "$digest_file" "docker-daemon:${image_id}" "docker://${REPOSITORY}:${tag}"
              digest=$(cat "$digest_file")
            else
              skopeo copy --digestfile "$digest_file" "docker://${REPOSITORY}@${digest}" "docker://${REPOSITORY}:${tag}"
              if [[ "$(cat "$digest_file")" != "$digest" ]]; then
                echo "${REPOSITORY}:${tag} got digest $(cat "$digest_file") instead of ${digest}." >&2
                exit 1
              fi
            fi
            echo "Pushed \`${REPOSITORY}:${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$TAGS"

          if [[ -z "$digest" ]]; then
            echo "No tag to push." >&2
            exit 1
          fi
          echo "Digest: \`${REPOSITORY}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Remove local image and registry credentials
        if: ${{ always() }}
        run: |
          docker image rm --force "$LOCAL_IMAGE" || true
          rm -f "$REGISTRY_AUTH_FILE" "$IMAGE_ID_FILE" "${IMAGE_ID_FILE}.digest"

  deploy:
    needs: build
    if: ${{ inputs.push && inputs.aap_job_template != '' }}
    runs-on: ${{ inputs.platform }}
    timeout-minutes: ${{ inputs.aap_timeout_minutes }}
    permissions: {}
    steps:
      - name: Launch AAP job and wait for it
        env:
          AAP_URL: ${{ inputs.aap_url }}
          AAP_JOB_TEMPLATE: ${{ inputs.aap_job_template }}
          AAP_LAUNCH: ${{ inputs.aap_launch }}
          AAP_USERNAME: ${{ secrets.aap_username }}
          AAP_PASSWORD: ${{ secrets.aap_password }}
        run: |
          set -o pipefail

          if [[ -z "$AAP_USERNAME" || -z "$AAP_PASSWORD" ]]; then
            echo "aap_job_template requires secrets.aap_username and secrets.aap_password." >&2
            exit 1
          fi

          if [[ "${AAP_USERNAME}${AAP_PASSWORD}" == *[$'\n\r']* ]]; then
            echo "secrets.aap_username and secrets.aap_password must not contain line breaks." >&2
            exit 1
          fi

          if [[ ! "$AAP_JOB_TEMPLATE" =~ ^[0-9]+$ ]]; then
            echo "aap_job_template must be a numeric job template ID." >&2
            exit 1
          fi

          # curl reads the credentials as a config from a pipe, so they never appear in its
          # arguments, which every process on the host can read from /proc/<pid>/cmdline.
          credentials="${AAP_USERNAME}:${AAP_PASSWORD}"
          credentials="${credentials//\\/\\\\}"
          credentials="${credentials//\"/\\\"}"
          api="${AAP_URL%/}/api/controller/v2"
          aap() {
            printf 'user = "%s"\n' "$credentials" |
              curl --config - --fail-with-body --silent --show-error --max-time 60 \
                --header 'Content-Type: application/json' "$@"
          }

          if ! launch=$(aap --request POST --data "$AAP_LAUNCH" "${api}/job_templates/${AAP_JOB_TEMPLATE}/launch/"); then
            echo "::error::AAP refused to launch job template ${AAP_JOB_TEMPLATE}: ${launch}"
            exit 1
          fi

          job=$(jq -r '.job' <<< "$launch")
          if [[ ! "$job" =~ ^[0-9]+$ ]]; then
            echo "::error::The AAP launch response has no job ID: ${launch}"
            exit 1
          fi
          job_url="${AAP_URL%/}/execution/jobs/playbook/${job}/output"
          echo "Launched [AAP job ${job}](${job_url})" >> "$GITHUB_STEP_SUMMARY"

          # The job timeout ends the wait for a job that never finishes.
          while true; do
            if ! job_details=$(aap "${api}/jobs/${job}/"); then
              echo "::error::AAP did not return job ${job}: ${job_details}"
              exit 1
            fi

            status=$(jq -r '.status' <<< "$job_details")
            echo "job ${job}: ${status}"
            case "$status" in
              successful) exit 0 ;;
              failed|error|canceled)
                echo "::error::AAP job ${job} finished as '${status}': ${job_url}"
                exit 1
                ;;
            esac
            sleep 15
          done
